name: Verifica chiave di firma

on:
  push:
    paths: ['.github/workflows/verifica-firma.yml']
  workflow_dispatch:

jobs:
  verifica:
    runs-on: ubuntu-latest
    steps:
      - name: Controlla la chiave nei Secrets
        env:
          KS: ${{ secrets.KEYSTORE_B64 }}
          PW: ${{ secrets.KEYSTORE_PASS }}
        run: |
          ATTESA="A5:43:C6:14:80:D6:E7:C8:D8:44:16:42:41:20:1F:CB:A0:77:2E:5B:0F:34:BB:02:F8:27:09:73:4D:39:FA:36"
          echo "$KS" | base64 -d > "$RUNNER_TEMP/f.p12"
          F=$(keytool -list -v -keystore "$RUNNER_TEMP/f.p12" -storetype PKCS12 -storepass "$PW" -alias appinstall | grep -m1 'SHA256:' | awk '{print $2}')
          rm -f "$RUNNER_TEMP/f.p12"
          echo "Impronta trovata: $F"
          echo "Impronta attesa:  $ATTESA"
          test "$F" = "$ATTESA"
